name: "⚙️ Improve collection or reasoning"
description: An idea for how evidence is collected, how the why is written, or how claims are checked.
labels: ["enhancement", "engine"]
body:
  - type: markdown
    attributes:
      value: |
        The engine collects a line's history from the provider, writes the reconstruction, and then checks every citation and quote deterministically. The model can only explain what was collected; ideas that keep that boundary intact are the easiest to take on.

        ---
        ### 🎯 The problem
  - type: dropdown
    id: area
    attributes:
      label: Part of the engine
      options:
        - "Collection: GitHub"
        - "Collection: GitLab or self-hosted GitLab"
        - "Collection: local git"
        - "Synthesis: how the why is written"
        - "Audit: citations and verbatim quotes"
        - Confidence and verdict
        - Language of the analysis
        - Performance, limits or cost
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's missing or wrong today
      placeholder: "Squash-merged PRs on GitLab lose their review threads, so…"
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: A line where it matters
      description: A public repository and line that shows the problem, if you have one.
      placeholder: "acme/payments-service · src/billing/charge.ts:9"
  - type: markdown
    attributes:
      value: |
        ---
        ### 💡 The idea
  - type: textarea
    id: proposal
    attributes:
      label: What you'd change
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: Cost, latency, provider rate limits, privacy, or anything this could make worse.
  - type: checkboxes
    id: principles
    attributes:
      label: This idea keeps Understory honest
      description: Tick what applies. It's fine to leave some unticked and explain why.
      options:
        - label: The model still can't assert anything the collected evidence doesn't back.
        - label: Deterministic checks stay deterministic, with no model in the loop.
        - label: Absence stays visible as absence.
