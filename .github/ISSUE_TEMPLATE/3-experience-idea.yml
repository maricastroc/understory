name: "✨ Improve the investigation experience"
description: An idea for reading the answer, checking evidence or exploring a line's history.
labels: ["enhancement", "ui"]
body:
  - type: markdown
    attributes:
      value: |
        Understory is read in three steps: the **answer** first, then the **evidence** that lets you trust it, then the full **history** for anyone who wants to dig. The best ideas make one of those steps easier without hiding the others.

        ---
        ### 🎯 The problem
  - type: dropdown
    id: layer
    attributes:
      label: Which step
      options:
        - "Answer: reading the reconstructed why"
        - "Evidence: checking a single claim"
        - "History: exploring the line's past"
        - "Composer: choosing a repository, file, line or question"
        - Landing page
        - VS Code extension
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's hard today
      description: Describe the moment it gets in the way, not the solution yet.
      placeholder: "To check why clause 3 cites review B, I have to…"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ### 💡 The idea
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: references
    attributes:
      label: Sketches or references
      description: Drag images, links to other tools, or a quick mockup.
  - type: checkboxes
    id: principles
    attributes:
      label: This idea keeps Understory honest
      description: Tick what applies. It's fine to leave some unticked and explain why.
      options:
        - label: Every claim stays traceable to a real artifact.
        - label: A silent history is still shown as silent, not filled in.
        - label: It works with a keyboard and a screen reader.
